name: CI e deploy VPS
on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sonar:
        description: Executar SonarQube nesta branch (sem deploy)
        type: boolean
        default: false

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: '0'

defaults:
  run:
    shell: bash

jobs:
  release_policy:
    name: 0. Validar origem da release main
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.policy.outputs.deploy }}
    steps:
      - name: Obter histórico e tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Conferir criação da tag no HEAD de main
        id: policy
        run: node scripts/ci/release-policy.mjs

  validate:
    name: 1. Validar, testar e gerar cobertura
    needs: release_policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-only-security-tests
          POSTGRES_DB: security
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U test -d security"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Validar TypeScript e scripts de deploy
        run: |
          npm run typecheck
          for file in scripts/ci/*.sh; do bash -n "$file"; done
          shellcheck -S warning scripts/ci/*.sh

      - name: Testar com cobertura real
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://test:ci-only-security-tests@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/security
        run: npm run test:coverage

      - name: Testar concorrência e restauração do catálogo em PostgreSQL descartável
        run: npm run test:catalog:postgres

      - name: Publicar cobertura e relatórios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_id }}
          path: |
            coverage/lcov.info
            reports/web/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 1

  sonarqube:
    name: 2. SonarQube e Quality Gate
    needs: [validate, release_policy]
    if: (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.release_policy.outputs.deploy == 'true') || (github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_dispatch' && inputs.sonar)
    runs-on: [self-hosted, Windows, X64, windows-portela-dev]
    timeout-minutes: 15
    concurrency:
      group: sonar-${{ github.repository }}-develop
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
    steps:
      - name: Obter histórico completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Baixar cobertura do mesmo commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reports-${{ github.run_id }}
          path: reports
      - name: Conferir configuração e servidor
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) { throw 'Configure SONAR_TOKEN nos secrets do repositório.' }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) { throw 'Configure SONAR_HOST_URL nas variables do repositório.' }
          if (-not (Test-Path -LiteralPath 'reports/coverage/lcov.info')) { throw 'Cobertura do commit não encontrada.' }
          $headers = @{ 'ngrok-skip-browser-warning' = 'true'; Accept = 'application/json' }
          $response = Invoke-WebRequest -UseBasicParsing -Uri ($env:SONAR_HOST_URL.TrimEnd('/') + '/api/system/status') -Headers $headers -TimeoutSec 30
          try { $status = $response.Content | ConvertFrom-Json } catch { throw 'A URL do SonarQube não retornou JSON. Confira o túnel ngrok e sua configuração de acesso.' }
          if ($status.status -ne 'UP') { throw 'SonarQube indisponível.' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            try {
              Write-Output 'Diagnóstico da análise anterior; o Quality Gate desta execução será calculado pelo scanner.'
              $key = ((Get-Content sonar-project.properties | Select-String '^sonar.projectKey=').Line -split '=', 2)[1]
              $authHeaders = @{ Authorization = 'Bearer ' + $env:SONAR_TOKEN; 'ngrok-skip-browser-warning' = 'true' }
              $base = $env:SONAR_HOST_URL.TrimEnd('/')
              $gate = Invoke-RestMethod -Uri ($base + '/api/qualitygates/project_status?projectKey=' + $key) -Headers $authHeaders -TimeoutSec 30
              $gate.projectStatus | ConvertTo-Json -Depth 5
              $issues = Invoke-RestMethod -Uri ($base + '/api/issues/search?componentKeys=' + $key + '&resolved=false&ps=100') -Headers $authHeaders -TimeoutSec 30
              $issues.issues | Select-Object rule,component,line,message | ConvertTo-Json -Depth 5
            } catch { Write-Warning 'Não foi possível consultar o diagnóstico anterior. A análise seguirá normalmente.' }
          }
      - name: Preparar verificação de assinatura do scanner
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command gpg.exe -ErrorAction SilentlyContinue) -or -not (Get-Command dirmngr.exe -ErrorAction SilentlyContinue)) {
            $git = Get-Command git.exe -ErrorAction Stop
            $gitTools = Join-Path (Split-Path -Parent (Split-Path -Parent $git.Source)) 'usr/bin'
            foreach ($tool in @('gpg.exe', 'dirmngr.exe')) {
              if (-not (Test-Path -LiteralPath (Join-Path $gitTools $tool))) { throw "Ferramenta ausente: $tool" }
            }
            [IO.File]::AppendAllText($env:GITHUB_PATH, $gitTools + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          }
      - name: Analisar e aguardar Quality Gate
        id: sonar
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Mostrar motivos do Quality Gate desta análise
        if: failure() && steps.sonar.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $key = ((Get-Content sonar-project.properties | Select-String '^sonar.projectKey=').Line -split '=', 2)[1]
          $headers = @{ Authorization = 'Bearer ' + $env:SONAR_TOKEN; 'ngrok-skip-browser-warning' = 'true' }
          $base = $env:SONAR_HOST_URL.TrimEnd('/')
          $gate = Invoke-RestMethod -Uri ($base + '/api/qualitygates/project_status?projectKey=' + $key) -Headers $headers -TimeoutSec 30
          $gate.projectStatus | ConvertTo-Json -Depth 5
          $issues = Invoke-RestMethod -Uri ($base + '/api/issues/search?componentKeys=' + $key + '&resolved=false&inNewCodePeriod=true&ps=100') -Headers $headers -TimeoutSec 30
          $issues.issues | Select-Object rule,component,line,message | ConvertTo-Json -Depth 5

  image:
    name: 3. Compilar e validar imagem Docker
    needs: [validate, release_policy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js para o manifesto
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Compilar, testar e empacotar
        env:
          PACKAGE_DEPLOY_IMAGE: ${{ needs.release_policy.outputs.deploy }}
        run: bash scripts/ci/package-image.sh
      - name: Publicar imagem e manifesto com SHA-256
        if: github.event_name == 'push' && github.ref_type == 'tag' && needs.release_policy.outputs.deploy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vps-bundle/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1

  deploy:
    name: 4. Deploy independente por SSH
    needs: [release_policy, validate, sonarqube, image]
    if: github.event_name == 'push' && github.event.created == true && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.release_policy.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: vps-${{ github.repository }}-production
      cancel-in-progress: false
    steps:
      - name: Obter scripts do commit validado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Baixar imagem validada
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vps-bundle
      - name: Verificar e implantar
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/ci/deploy-vps.sh
